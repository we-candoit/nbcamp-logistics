spring:
  application:
    name: gateway-server
  cloud:
    gateway.server.webflux:
          discovery:
            locator:
              enabled: false        #서비스 이름으로 자동 라우트 생성 끔
          routes:
            - id: ${USER_SERVICE_NAME}
              uri: lb://${USER_SERVICE_NAME}
              predicates:
                - Path=${USER_SERVICE_PATHS}

            - id: ${HUB_SERVICE_NAME}
              uri: lb://${HUB_SERVICE_NAME}
              predicates:
                - Path=${HUB_SERVICE_PATHS}

            - id: ${COMPANY_SERVICE_NAME}
              uri: lb://${COMPANY_SERVICE_NAME}
              predicates:
                - Path=${COMPANY_SERVICE_PATHS}

            - id: ${ORDER_SERVICE_NAME}
              uri: lb://${ORDER_SERVICE_NAME}
              predicates:
                - Path=${ORDER_SERVICE_PATHS}

            - id: ${DELIVERY_SERVICE_NAME}
              uri: lb://${DELIVERY_SERVICE_NAME}
              predicates:
                - Path=${DELIVERY_SERVICE_PATHS}
    # 로드밸런서의 캐시를 사용하지 않도록 설정
    # 개발 환경을 위한 설정이므로 프로덕션 환경에서 변경 필요
    loadbalancer:
      cache:
        enabled: false

server:
  port: ${GATEWAY_SERVER_PORT}

eureka:
  client:
    # 레지스트리를 조회해서 가져오는 시간을 1초로 설정
    # 빠른 서비스 등록 / 조회를 위해 설정한 것으로 프로덕션 환경에서 변경 필요
    registry-fetch-interval-seconds: 1
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${DISCOVERY_SERVER_NAME}:${DISCOVERY_SERVER_PORT}/eureka/
  instance:
    prefer-ip-address: true
spring:
  application:
    name: eureka

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${DISCOVERY_SERVER_NAME}:${DISCOVERY_SERVER_PORT}/eureka/
  instance:
    hostname: ${DISCOVERY_SERVER_NAME}

server:
  port: ${DISCOVERY_SERVER_PORT}
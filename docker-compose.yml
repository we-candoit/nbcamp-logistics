#############################
######   공통 환경 설정   ######
#############################
x-common-spring: &common-spring
  image: bellsoft/liberica-openjdk-alpine:21
  working_dir: /app
  entrypoint: ["sh", "/entrypoint.sh"]
  networks: [logistics-network]

x-entrypoint-spring: &entrypoint-spring
  "./entrypoint.sh:/entrypoint.sh:ro"


services:
#############################
######   비즈니스 서비스   ######
#############################
  user-service:
    <<: *common-spring
    container_name: user-service
    env_file: ./logistics-envs/user-service.env
    ports: ["8082:8080"]
    volumes:
      - ./services/user-service:/app
      - *entrypoint-spring
    depends_on: [eureka-server, db-server]

  order-service:
    <<: *common-spring
    container_name: order-service
    env_file: ./logistics-envs/order-service.env
    ports: ["8083:8080"]
    volumes:
      - ./services/order-service:/app
      - *entrypoint-spring
    depends_on: [eureka-server, db-server]

  delivery-service:
    <<: *common-spring
    container_name: delivery-service
    env_file: ./logistics-envs/delivery-service.env
    ports: ["8084:8080"]
    volumes:
      - ./services/delivery-service:/app
      - *entrypoint-spring
    depends_on: [eureka-server, db-server]

  hub-service:
    <<: *common-spring
    container_name: hub-service
    env_file: ./logistics-envs/hub-service.env
    ports: ["8085:8080"]
    volumes:
      - ./services/hub-service:/app
      - *entrypoint-spring
    depends_on: [eureka-server, db-server]

  company-service:
    <<: *common-spring
    container_name: company-service
    env_file: ./logistics-envs/company-service.env
    ports: ["8086:8080"]
    volumes:
      - ./services/company-service:/app
      - *entrypoint-spring
    depends_on: [eureka-server, db-server]


#######################
######   인프라    ######
#######################
  eureka-server:
    <<: *common-spring
    container_name: eureka-server
    env_file: ./logistics-envs/eureka-server.env
    volumes:
      - ./infra/eureka-server:/app
      - *entrypoint-spring
    ports: 
      - "8081:8080"
    restart: always


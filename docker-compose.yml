###########################
######   데이터베이스   ######
###########################
  db-server:
    container_name: db-server
    image: postgres:16-alpine
    env_file: ./logistics-envs/db-server.env
    volumes:
      - volume-db:/var/lib/postgresql/data
      - ./infra/db-server/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
        - logistics-network
    restart: always


networks:
  logistics-network:
    name: logistics-network
    driver: bridge


volumes:
  volume-db:
    name: volume-db
    driver: local
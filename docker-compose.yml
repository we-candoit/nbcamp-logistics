x-common-spring: &common-spring
  image: bellsoft/liberica-openjdk-alpine:21
  working_dir: /app
  entrypoint: ["sh", "/entrypoint.sh"]
  networks: [logistics-network]

x-entrypoint-spring: &entrypoint-spring
  "./entrypoint.sh:/entrypoint.sh:ro"

x-env: &env
  DISCOVERY_SERVER_NAME: ${DISCOVERY_SERVER_NAME}
  CONFIG_SERVER_NAME: ${CONFIG_SERVER_NAME}
  DISCOVERY_SERVER_PORT: ${DISCOVERY_SERVER_PORT}
  CONFIG_SERVER_PORT: ${CONFIG_SERVER_PORT}

x-db-env: &db-env
  DB_SERVER_NAME: ${DB_SERVER_NAME}
  DB_SERVER_PORT: ${DB_SERVER_PORT}
  POSTGRES_DB: ${POSTGRES_DB}

services:
#############################
######   비즈니스 서비스   ######
#############################
  user-service:
    container_name: user-service
    volumes:
      - ./services/user-service:/app
      - *entrypoint-spring
    depends_on: [eureka-server, db-server]
    <<: *common-spring
    environment:
      <<: [*env, *db-env]
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DB_SCHEMA: ${DB_USER_SCHEMA}
      DB_USERNAME: ${DB_USER_SCHEMA_USERNAME}
      DB_PASSWORD: ${DB_USER_SCHEMA_PASSWORD}

  order-service:
    container_name: order-service
    volumes:
      - ./services/order-service:/app
      - *entrypoint-spring
    depends_on: [eureka-server, db-server]
    <<: *common-spring
    environment:
      <<: [*env, *db-env]
      DB_SCHEMA: ${DB_ORDER_SCHEMA}
      DB_USERNAME: ${DB_ORDER_SCHEMA_USERNAME}
      DB_PASSWORD: ${DB_ORDER_SCHEMA_PASSWORD}
    restart: always

  delivery-service:
    container_name: delivery-service
    volumes:
      - ./services/delivery-service:/app
      - *entrypoint-spring
    depends_on: [eureka-server, db-server]
    <<: *common-spring
    environment:
      <<: [*env, *db-env]
      DB_SCHEMA: ${DB_DELIVERY_SCHEMA}
      DB_USERNAME: ${DB_DELIVERY_SCHEMA_USERNAME}
      DB_PASSWORD: ${DB_DELIVERY_SCHEMA_PASSWORD}

  hub-service:
    container_name: hub-service
    volumes:
      - ./services/hub-service:/app
      - *entrypoint-spring
    depends_on: [eureka-server, db-server]
    <<: *common-spring
    environment:
      <<: [*env, *db-env]
      DB_SCHEMA: ${DB_HUB_SCHEMA}
      DB_USERNAME: ${DB_HUB_SCHEMA_USERNAME}
      DB_PASSWORD: ${DB_HUB_SCHEMA_PASSWORD}

  company-service:
    container_name: company-service
    volumes:
      - ./services/company-service:/app
      - *entrypoint-spring
    depends_on: [eureka-server, db-server]
    <<: *common-spring
    environment:
      <<: [*env, *db-env]
      DB_SCHEMA: ${DB_COMPANY_SCHEMA}
      DB_USERNAME: ${DB_COMPANY_SCHEMA_USERNAME}
      DB_PASSWORD: ${DB_COMPANY_SCHEMA_PASSWORD}


#######################
######   인프라    ######
#######################
  eureka-server:
    container_name: eureka-server
    volumes:
      - ./infra/eureka-server:/app
      - *entrypoint-spring
    ports: 
      - "8081:8080"
    <<: *common-spring
    restart: always
    environment:
      <<: [*env]

  # api-gateway:
  #   container_name: api-gateway
  #   volumes:
  #     - ./infra/api-gateway:/app
  #     - *entrypoint-spring
  #   ports:
  #     - "8080:8080"
  #   <<: *common-spring
  #   # restart: always
  #   environment:
  #     <<: [*env]
  #     JWT_SECRET_KEY: ${JWT_SECRET_KEY}


###########################
######   데이터베이스   ######
###########################
  db-server:
    container_name: db-server
    env_file: ./db.env
    image: postgres:16-alpine
    volumes:
      - volume-db:/var/lib/postgresql/data
      - ./infra/db-server/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
        - logistics-network
    restart: always

networks:
  logistics-network:
    name: logistics-network
    driver: bridge

volumes:
  volume-db:
    name: volume-db
    driver: local
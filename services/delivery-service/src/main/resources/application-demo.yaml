# Active profiles에 local,demo를 지정하면 로컬 DB 설정과 시연 기능을 함께 할 수 있습니다.
# 이 프로필은 별도 DB를 만들지 않으며, 저장한 시연 데이터는 프로필을 꺼도 남습니다.
delivery:
  demo:
    auto-assignment:
      # true: 신규 배송에 자동 배정, false: 기존 MASTER 수동 배정 사용
      enabled: ${DELIVERY_DEMO_AUTO_ASSIGNMENT_ENABLED:false}
      # 출발 허브 UUID: 담당자 UUID. 자격과 허브 소속이 확인된 실제 계정으로 설정
      # 매핑이 없는 허브는 미배정으로 생성, 아래 빈 맵을 필요한 매핑으로 교체
      # 예시(그대로 사용하지 말 것):
      # hub-managers:
      #   "22222222-2222-4222-8222-222222222222": "88888888-8888-4888-8888-888888888888"
      hub-managers: {}
    actual-metrics:
      # 자동 배정 설정과 독립적, 배송 경로 최초 도착 시 고정값을 기록한다.
      enabled: ${DELIVERY_DEMO_ACTUAL_METRICS_ENABLED:true}
      # 거리 단위 km, 시간 단위 분. 실제 측정한 값이 아닌 시연용 데이터임.
      hub-to-hub:
        distance: 100.00
        duration: 90
      hub-to-company:
        distance: 5.00
        duration: 15

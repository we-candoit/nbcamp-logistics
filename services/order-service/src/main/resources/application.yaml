spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_SERVER_NAME}:${DB_SERVER_PORT}/${POSTGRES_DB}?currentSchema=${DB_SCHEMA}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # 개발 환경 설정
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: true

  cloud:
    openfeign:
      client:
        config:
          #모든 Feign 클라이언트 공통 / 연결 3초, 응답대기 5초
          default:
            connect-timeout: 3000
            read-timeout: 5000

eureka:
  client:
    service-url:
      defaultZone: http://${DISCOVERY_SERVER_NAME}:${DISCOVERY_SERVER_PORT}/eureka/

#주문 재보상 스케줄러 / COMPENSATION_FAILED 주문을 주기적으로 다시 보상
order:
  compensation-retry:
    fixed-delay-ms: 30000 #이전 실행이 끝난 뒤 30초 대기
    batch-size: 50 #한 번에 재보상할 최대 주문 수
    max-retry-count: 5 #재보상 실패 횟수 상한 / 도달하면 수동 처리 대상
    stale-waiting-minutes: 10 #생성 후 이 시간이 지나도 WAITING이면 재보상 대상으로 전환 (주문생성 중 서버 종료)
    #외부 호출 헤더, 감사 정보에 쓰는 시스템 사용자 / 기본값은 더미 데이터의 MASTER 계정
    system-user-id: ${SYSTEM_USER_ID:11111111-1111-1111-1111-111111111111}
    system-user-role: MASTER
